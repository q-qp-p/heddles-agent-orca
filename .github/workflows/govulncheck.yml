name: Govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan so advisories published after the last PR still surface.
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Fetch Git LFS objects
        uses: ./.github/actions/lfs-pull

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
