name: Release

# Pushing an annotated v*.*.* tag builds and publishes everything for that tag,
# then creates the GitHub Release:
#   - component images (multi-arch) -> ghcr.io/heddles/agent-orca/<name>:<tag> (+ :latest)
#   - aoctl binaries for linux/darwin/windows x amd64/arm64 -> release assets
#   - Helm charts (version = tag without the "v", images pinned to the tag)
#       -> oci://ghcr.io/heddles/agent-orca/charts and release assets
#   - the Release itself: the tag's annotation followed by generated notes
#
# The tag push is the only automatic trigger. Publishing a Release by hand used
# to trigger a second, parallel build of the same tag; this workflow creates
# the Release itself instead. workflow_dispatch rebuilds an existing tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.7.0"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/heddles/agent-orca
  CHART_REPO: oci://ghcr.io/heddles/agent-orca/charts
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            dockerfile: Dockerfile
          - name: model-router
            dockerfile: cmd/model-router/Dockerfile
          - name: mcp-ingester
            dockerfile: Dockerfile.mcp-ingester
          - name: ui-proxy
            dockerfile: Dockerfile.ui-proxy
          - name: openai-reference
            dockerfile: Dockerfile.go.openai-reference
          - name: dev-sandbox
            dockerfile: Dockerfile.dev-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The router and operator images embed the Switchyard guest, which is in LFS.
      - uses: ./.github/actions/lfs-pull

      # Go and node stages run on the build platform and cross-compile
      # (FROM --platform=$BUILDPLATFORM); QEMU is only needed for the
      # final-stage layers of the arm64 image.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ env.TAG }}
            ${{ env.IMAGE_REPO }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  aoctl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build aoctl ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="aoctl_${TAG}_${GOOS}_${GOARCH}"
          bin=aoctl
          [ "$GOOS" = windows ] && bin=aoctl.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/$bin" ./cmd/aoctl
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: aoctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: azure/setup-helm@v5

      - name: Package charts
        run: |
          version="${TAG#v}"
          # Released charts deploy the images built for this tag, not :latest.
          sed -i -E "s/^(\s+tag: )\"latest\"/\1\"${TAG}\"/" charts/agent-orca/values.yaml
          mkdir -p dist
          # agent-orca depends on the OpenShell gateway chart from an OCI registry;
          # helm package fails without it in charts/.
          helm dependency build charts/agent-orca
          for c in agent-orca agent-orca-resources model-providers; do
            helm lint "charts/$c"
            helm package "charts/$c" --version "$version" --app-version "$TAG" -d dist
          done

      - name: Push charts to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          for f in dist/*.tgz; do
            helm push "$f" "$CHART_REPO"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: charts
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [images, aoctl, charts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Only our own artifacts: build-push-action also uploads *.dockerbuild
      # build records to the run, which download-artifact cannot extract.
      - uses: actions/download-artifact@v8
        with:
          pattern: aoctl-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: charts
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout leaves the tag as a lightweight ref; fetch the annotated object.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          {
            git tag -l --format='%(contents)' "$TAG"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "helm install agent-orca ${CHART_REPO}/agent-orca --version ${TAG#v} -n agent-orca-system --create-namespace"
            echo '```'
            echo
            echo "Images: \`${IMAGE_REPO}/{operator,model-router,mcp-ingester,ui-proxy,openai-reference,dev-sandbox}:${TAG}\`"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TAG" \
              --notes-file notes.md \
              --generate-notes
          fi
