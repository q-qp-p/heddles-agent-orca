name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Fetch Git LFS objects
        uses: ./.github/actions/lfs-pull

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
