name: UI E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install UI dependencies and Playwright
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agent-orca-ui-e2e

      - name: Add Helm repositories
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo update

      - name: Deploy CNPG operator
        run: |
          helm upgrade --install cnpg cnpg/cloudnative-pg \
            --namespace cnpg-system \
            --create-namespace \
            --wait --timeout 120s

      - name: Deploy CNPG PostgreSQL database
        run: |
          kubectl apply -f - <<EOF
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: agent-orca-db
            namespace: default
          spec:
            instances: 1
            primaryUpdateStrategy: unsupervised
            postgresql:
              parameters:
                shared_buffers: "256MB"
                max_connections: "200"
            bootstrap:
              initdb:
                database: agentorca
                owner: postgres
                secret:
                  name: postgres-app
            storage:
              size: 1Gi
          EOF

      - name: Pre-pull Redis image into Kind
        # redis:7-alpine is deployed by the chart but NOT pre-loaded into the
        # kind nodes. Pulling + loading it here avoids a runtime image pull
        # that can push the Helm --wait spend past the timeout on slow runners.
        run: |
          docker pull redis:7-alpine
          kind load docker-image redis:7-alpine --name agent-orca-ui-e2e

      - name: Build and load images
        run: |
          make docker-build IMG=agent-orca:e2e
          docker build -t agent-orca-ui:e2e -f Dockerfile.ui-proxy .
          kind load docker-image agent-orca:e2e agent-orca-ui:e2e --name agent-orca-ui-e2e

      - name: Deploy with Helm
        run: |
          make install
          helm upgrade --install agent-orca ./charts/agent-orca \
            --set operator.image.repository=agent-orca \
            --set operator.image.tag=e2e \
            --set ui.image.repository=agent-orca-ui \
            --set ui.image.tag=e2e \
            --wait --timeout 300s

      - name: Port-forward UI
        run: |
          kubectl port-forward svc/agent-orca-ui 8080:80 &
          sleep 3

      - name: Run Playwright tests
        working-directory: ui
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      - name: Diagnose deployment failures
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A -o wide || true
          echo "=== Deployments ==="
          kubectl get deploy -A || true
          echo "=== StatefulSets ==="
          kubectl get sts -A || true
          echo "=== Secrets ==="
          kubectl get secrets -A || true
          echo "=== Recent events (warnings/errors) ==="
          kubectl get events -A 2>/dev/null | grep -iE "warning|error|fail|kill|oom|mount" | tail -30 || true
          echo "=== Operator pod describe ==="
          kubectl describe pod -l app.kubernetes.io/component=operator -n default || true
          echo "=== Operator pod YAML (for container exit codes) ==="
          kubectl get pods -l app.kubernetes.io/component=operator -n default -o yaml || true
          echo "=== Operator pod logs (current) ==="
          kubectl logs -l app.kubernetes.io/component=operator -n default --tail=200 || true
          echo "=== Operator pod logs (previous) ==="
          kubectl logs -l app.kubernetes.io/component=operator -n default --previous --tail=200 || true
          echo "=== Redis pod logs ==="
          kubectl logs -l app.kubernetes.io/component=redis -n default --tail=100 || true
          echo "=== UI pod logs (current) ==="
          kubectl logs -l app.kubernetes.io/component=ui -n default --tail=100 || true
          echo "=== UI pod logs (previous) ==="
          kubectl logs -l app.kubernetes.io/component=ui -n default --previous --tail=100 || true
          echo "=== Helm release status ==="
          helm status agent-orca 2>/dev/null || true
          echo "=== Helm release history ==="
          helm history agent-orca 2>/dev/null || true
          echo "=== Playwright report ==="
          ls ui/test-results/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ui/test-results/
