name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Fetch Git LFS objects
        uses: ./.github/actions/lfs-pull

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Check Dockerfile COPY lines
        run: make verify-docker-deps
      - name: Run linter
        run: make lint
