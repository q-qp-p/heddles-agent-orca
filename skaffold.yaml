apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: agent-orca
build:
  local:
    push: false
  hooks:
    before: &ensure_kind_build_before
      - command: ["bash", "hack/ensure-kind-cluster.sh"]
        os: [darwin, linux]
    # Build the reference agent image (ghcr.io/heddles/agent-orca/openai-reference)
    # and load it into the kind cluster as `:latest`, so the demos and
    # hack/test-agents.sh (which pin ociRef => …/openai-reference:latest) resolve
    # locally — just like the operator/router/ui-proxy images, minus the global SHA tag.
    # Skip-if-present keeps the dev loop fast; non-fatal so a docker/kind hiccup
    # never breaks `skaffold dev`. Delete the local `:latest` tag to force a rebuild
    # after changing examples/agent-sdk-template/agent.py.
    after:
      - command:
          - bash
          - -c
          - |
            if command -v kind >/dev/null 2>&1 && ! docker image inspect ghcr.io/heddles/agent-orca/openai-reference:latest >/dev/null 2>&1; then
              echo "building reference agent image (openai-reference:latest)…"
              docker build -t ghcr.io/heddles/agent-orca/openai-reference:latest -f examples/agent-sdk-template/Dockerfile . \
                && kind load docker-image ghcr.io/heddles/agent-orca/openai-reference:latest --name agent-orca-dev \
                || echo "warning: reference agent image build/load failed (non-fatal); demos will pull :latest from GHCR if online"
            else
              echo "reference agent image present locally (openai-reference:latest) — skipping build"
            fi
        os: [darwin, linux]
  artifacts:
    - image: ghcr.io/heddles/agent-orca/operator
      context: .
      docker:
        dockerfile: Dockerfile
    - image: ghcr.io/heddles/agent-orca/model-router
      context: .
      docker:
        dockerfile: cmd/model-router/Dockerfile
    - image: ghcr.io/heddles/agent-orca/ui-proxy
      context: .
      docker:
        dockerfile: Dockerfile.ui-proxy
    - image: ghcr.io/heddles/agent-orca/mcp-ingester
      context: .
      docker:
        dockerfile: Dockerfile.mcp-ingester
    - image: ghcr.io/heddles/agent-orca/openai-reference
      context: .
      docker:
        dockerfile: Dockerfile.go.openai-reference
deploy:
  helm:
    hooks: &ensure_kind_deploy_hooks
      before:
        - host:
            command: ["bash", "hack/ensure-kind-cluster.sh"]
            os: [darwin, linux]
        - host:
            command: ["bash", "-c", "kubectl create namespace agent-orca-system || true"]
            os: [darwin, linux]
        # - host:
        #     command: ["bash", "-c", "helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts 2>/dev/null || true"]
        #     os: [darwin, linux]
        # - host:
        #     command: ["bash", "-c", "helm repo add grafana-dashboards https://cloudnative-pg.github.io/grafana-dashboards 2>/dev/null || true"]
        #     os: [darwin, linux]
        # Sync Kubernetes CRDs with the source tree on every deploy. Helm applies the
        # agent-orca chart's charts/agent-orca/crds/ on first install, but does NOT
        # upgrade CRDs on `helm upgrade` — so a new spec field (e.g. webhookNotify)
        # would otherwise be rejected at runtime with "field not declared in schema"
        # until manually applied. This keeps the cluster schema in lockstep with the
        # branch so `helm install`/`skaffold run` of demos Just Works.
        - host:
            command: ["bash", "-c", "kubectl apply -f config/crd/bases --server-side --force-conflicts --field-manager=helm 2>/dev/null || true"]
            os: [darwin, linux]

portForward:
  - resourceType: service
    resourceName: agent-orca-ui
    namespace: agent-orca-system
    port: 80
    localPort: 8080
  - resourceType: service
    resourceName: agent-orca-internal-api
    namespace: agent-orca-system
    port: 8000
    localPort: 8000
  - resourceType: service
    resourceName: agent-orca-internal-api
    namespace: agent-orca-system
    port: 8084
    localPort: 8084
  # UI API (:8083) — reachable directly so the OIDC /oauth/callback can be tested
  # against localhost without going through the UIProxy. (The UIProxy on :8080
  # also proxies /oauth/* once the proxy image is rebuilt.)
  - resourceType: service
    resourceName: agent-orca-internal-api
    namespace: agent-orca-system
    port: 8083
    localPort: 8083
profiles:
  # Builds and pushes only the coding-agent sandbox image (docs/coder-agent.md):
  #   skaffold build -p dev-sandbox --platform linux/amd64
  # then set the coder Agent's runtime.ociRef to the printed tag. It is not a
  # top-level artifact: the image is large and not needed by the dev loop.
  - name: dev-sandbox
    build:
      local:
        push: true
      artifacts:
        - image: ghcr.io/heddles/agent-orca/dev-sandbox
          context: .
          docker:
            dockerfile: Dockerfile.dev-sandbox
  - name: remote
    build:
      local:
        push: true
    deploy:
      helm:
        hooks:
          before:
            - host:
                command: ["bash", "-c", "kubectl create namespace agent-orca-system || true"]
                os: [darwin, linux]
            - host:
                command: ["bash", "-c", "kubectl apply -f charts/agent-orca/crds/"]
                os: [darwin, linux]
            # The OpenShell gateway is installed by the agent-orca release
            # (openshell.enabled) and generates its own client certificate Secret.
        releases:
          # CloudNativePG operator — installs CRDs + operator Deployment (first).
          - name: cloudnative-pg-operator
            chartPath: charts/cloudnative-pg
            namespace: agent-orca-system
            wait: true
            setValues:
              crds.create: "true"
              config.clusterWide: "true"
              image.tag: "1.30.0"
              replicaCount: "1"
          # CloudNativePG cluster — creates the Cluster CR (after operator is ready).
          - name: cloudnative-pg-cluster
            chartPath: charts/cluster
            namespace: agent-orca-system
            wait: false
            setValues:
              fullnameOverride: "postgres"
              cluster.instances: "1"
              cluster.imageName: "ghcr.io/cloudnative-pg/postgresql:16"
              cluster.storage.size: "10Gi"
              cluster.initdb.database: "agentorca"
              cluster.initdb.owner: "agentorca"
              cluster.enableSuperuserAccess: "true"
              cluster.superuserSecret: "postgres-superuser"
              cluster.enablePDB: "true"
          - name: agent-orca
            chartPath: charts/agent-orca
            namespace: agent-orca-system
            createNamespace: true
            wait: true
            setValues:
              operator.image.pullPolicy: Always
              modelRouter.image.pullPolicy: Always
              ui.image.pullPolicy: Always
              operator.leaderElection: true
              webhook.certManager: false
              webhook.failurePolicy: Fail
              database.enabled: "true"
              operator.oidc.cookieSecure: "true"
              operator.oidc.enabled: "true"
              operator.networkPolicy.oidcEgress.enabled: "true"
              # OpenShell sandboxes (gateway installed in the openshell namespace).
              openshell.enabled: "true"
              openshell.tls.secretName: openshell-client-tls
              # GitHub App for sandbox git access (agent-orca-factory). Secret
              # agentorca-github-app (app-id, installation-id, private-key) is created
              # out of band.
              github.app.secretName: agentorca-github-app
              # Slack incoming webhook (Secret webhook-notify, key url) for approval
              # requests and workflow completion notices.
              approvals.notifyWebhookSecret.name: webhook-notify
              # Sandboxes tolerate the autoscaled coder-agent pool (pnw-dev-agents-autoscaled,
              # tainted openshell=coder-agent:NoExecute). The pool has no label to select on,
              # so a sandbox lands there when it does not fit the regular workers.
              openshell.placement.tolerations[0].key: openshell
              openshell.placement.tolerations[0].operator: Equal
              openshell.placement.tolerations[0].value: coder-agent
              openshell.placement.tolerations[0].effect: NoExecute
              # Authenticate model-routers to hindsight; without it every recall and
              # retain gets 401. Secret hindsight-api-key (key api-key) holds the
              # HINDSIGHT_API_TENANT_API_KEY hindsight runs with and is created out of
              # band, e.g. copied from Secret hindsight/hindsight-secret.
              hindsight.apiKeySecret.name: hindsight-api-key
            setValueTemplates:
              operator.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_operator}}"
              mcpIngester.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_mcp_ingester}}"
              # Pinned by digest: the operator passes this to router pods in an env var,
              # which skaffold does not rewrite, and a development deploy reuses the tag.
              modelRouter.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_model_router}}@{{.IMAGE_DIGEST_ghcr_io_heddles_agent_orca_model_router}}"
              ui.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_ui_proxy}}"
              ingress.enabled: "false"
          - name: model-providers
            chartPath: charts/model-providers
            namespace: agent-orca-system
            createNamespace: true
            valuesFiles:
              - charts/model-providers/values.yaml
            setValueTemplates:
              providerSecrets[0].apiKey: "{{.OPENAI_API_KEY}}"
              providerSecrets[1].apiKey: "{{.ANTHROPIC_API_KEY}}"
              providerSecrets[2].apiKey: "{{.GOOGLE_API_KEY}}"
              providerSecrets[3].apiKey: "{{.OPENROUTER_API_KEY}}"
      # No kubectl deployer here: with no manifests to apply it prints
      # "nothing to deploy" and fails the run with exit code 1.
  - name: dev
    # activation:
    #   - kubeContext: kind-agent-orca-dev
    #     command: dev
    # In-cluster Ollama for local embeddings (nomic-embed-text). Applied as raw
    # manifests via the kubectl deployer below so skaffold tracks them for cleanup.
    manifests:
      rawYaml:
        - config/samples/ollama-embedding-cluster.yaml
    deploy:
      helm:
        hooks:
          before:
            - host:
                command: ["bash", "hack/ensure-kind-cluster.sh"]
                os: [darwin, linux]
            - host:
                command: ["bash", "-c", "kubectl create namespace agent-orca-system || true"]
                os: [darwin, linux]
            # - host:
            #     command: ["bash", "-c", "helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts 2>/dev/null || true"]
            #     os: [darwin, linux]
            # - host:
            #     command: ["bash", "-c", "helm repo add grafana-dashboards https://cloudnative-pg.github.io/grafana-dashboards 2>/dev/null || true"]
            #     os: [darwin, linux]
            - host:
                command: ["bash", "-c", "kubectl apply -f charts/agent-orca/crds/"]
                os: [darwin, linux]
            - host:
                command: ["bash", "-c", "kubectl apply -f config/samples/ingress-nginx-baremetal.yaml"]
                os: [darwin, linux]
          after:
            - host:
                command: ["echo", "Now you should add 127.0.0.1 agent-orca.local to your /etc/hosts file."]
        releases:
          # CloudNativePG operator — installs CRDs + operator Deployment (first).
          - name: cloudnative-pg-operator
            chartPath: charts/cloudnative-pg
            namespace: agent-orca-system
            wait: true
            setValues:
              crds.create: "true"
              config.clusterWide: "true"
              image.tag: "1.30.0"
              replicaCount: "1"
          # CloudNativePG cluster — creates the Cluster CR (after operator is ready).
          - name: cloudnative-pg-cluster
            chartPath: charts/cluster
            namespace: agent-orca-system
            wait: false
            setValues:
              fullnameOverride: "postgres"
              cluster.instances: "1"
              cluster.imageName: "ghcr.io/cloudnative-pg/postgresql:16"
              cluster.storage.size: "10Gi"
              cluster.initdb.database: "agentorca"
              cluster.initdb.owner: "agentorca"
              cluster.enableSuperuserAccess: "true"
              cluster.superuserSecret: "postgres-superuser"
              cluster.enablePDB: "true"
          - name: agent-orca
            chartPath: charts/agent-orca
            namespace: agent-orca-system
            createNamespace: true
            wait: true
            setValues:
              operator.image.pullPolicy: Never
              modelRouter.image.pullPolicy: Never
              ui.image.pullPolicy: Never
              operator.leaderElection: false
              webhook.certManager: false
              webhook.failurePolicy: Ignore
              database.enabled: "true"
              operator.oidc.cookieSecure: "false"
              operator.oidc.enabled: "false"
              operator.networkPolicy.oidcEgress.enabled: "false"
              openshell.enabled: true
              # The bundled gateway enforces mTLS and generates this client bundle; without
              # it the operator cannot reach the gateway and workflows never start.
              openshell.tls.secretName: openshell-client-tls
            setValueTemplates:
              operator.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_operator}}"
              mcpIngester.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_mcp_ingester}}"
              # Pinned by digest: the operator passes this to router pods in an env var,
              # which skaffold does not rewrite, and a development deploy reuses the tag.
              modelRouter.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_model_router}}@{{.IMAGE_DIGEST_ghcr_io_heddles_agent_orca_model_router}}"
              ui.image.tag: "{{.IMAGE_TAG_ghcr_io_heddles_agent_orca_ui_proxy}}"
              ingress.enabled: "true"
              ingress.ingressClassName: "nginx"
              ingress.host: "agent-orca.local"
          - name: model-providers
            chartPath: charts/model-providers
            namespace: agent-orca-system
            createNamespace: true
            valuesFiles:
              - charts/model-providers/values.yaml
            setValueTemplates:
              providerSecrets[0].apiKey: "{{.OPENAI_API_KEY}}"
              providerSecrets[1].apiKey: "{{.ANTHROPIC_API_KEY}}"
              providerSecrets[2].apiKey: "{{.GOOGLE_API_KEY}}"
              providerSecrets[3].apiKey: "{{.OPENROUTER_API_KEY}}"

      kubectl:
        defaultNamespace: agent-orca-system

  # demo-soc-triage: deploys the SOC Triage demo.
  # Requires: agent-orca + model-providers already deployed (skaffold dev -p dev).
  # Deploy: skaffold run -p demo-soc-triage
  # Remove:  helm uninstall demo-soc-triage -n agent-orca-system
  - name: demo-soc-triage
    build:
      artifacts: []
      # hooks:
      #   before: *ensure_kind_build_before
    deploy:
      helm:
        # hooks: *ensure_kind_deploy_hooks
        releases:
          - name: demo-soc-triage
            chartPath: charts/demos/demo-soc-triage
            namespace: agent-orca-system

  # demo-financial-analysis: deploys the Financial Impact Analysis demo.
  # Requires: agent-orca + 'default' ModelSelector + 'embeddings' ModelSelector already deployed.
  # Deploy: skaffold run -p demo-financial-analysis
  # Remove:  helm uninstall demo-financial-analysis -n agent-orca-system
  - name: demo-financial-analysis
    build:
      artifacts: []
      # hooks:
      #   before: *ensure_kind_build_before
    deploy:
      helm:
        # hooks: *ensure_kind_deploy_hooks
        releases:
          - name: demo-financial-analysis
            chartPath: charts/demos/demo-financial-analysis
            namespace: agent-orca-system

  # demo-llm-research: deploys the LLM Research Agent demo. The profile builds
  # the eval-runtime image (ghcr.io/heddles/agent-orca/eval-runtime) and loads
  # it into the kind cluster for local evaluation runs; the chart's agent
  # runtime currently pins the openai-reference image via runtime.ociRef.
  # Requires: agent-orca + model-providers already deployed (skaffold dev -p dev).
  # The model-providers chart must have ollama-embeddings enabled for local embeddings.
  # Deploy: skaffold run -p demo-llm-research
  # Remove:  helm uninstall demo-llm-research -n agent-orca-system
  - name: demo-llm-research
    build:
      artifacts:
        - image: ghcr.io/heddles/agent-orca/eval-runtime
          context: charts/demos/demo-llm-research
          docker:
            dockerfile: Dockerfile.eval
      # hooks:
        # before: *ensure_kind_build_before
    deploy:
      helm:
        # hooks: *ensure_kind_deploy_hooks
        releases:
          - name: demo-llm-research
            chartPath: charts/demos/demo-llm-research
            namespace: agent-orca-system

  # demo-programming-agent: deploys the Senior Programming Agent demo — a senior
  # software-engineer persona for the agent-orca codebase backed by a handbook RAG
  # KnowledgeBase and a read-only GitHub MCP stdio sidecar.
  # Requires: agent-orca + model-providers (with 'default' ModelSelector and
  # 'ollama-embed' embedding selector) already deployed (skaffold dev -p dev, with
  # ollama-embeddings enabled for local embeddings).
  # Requires: GitHub PAT with repo (read) scope — set via AGENT_ORCA_GITHUB_TOKEN.
  # Requires: Slack — an incoming webhook URL for the _webhook_notify builtin
  # (AGENT_ORCA_WEBHOOK_URL). The model-router posts to the webhook; no per-user
  # OAuth, no browser, no data residency concerns.
  # The agent image is the pre-built reference agent
  # (ghcr.io/heddles/agent-orca/openai-reference:latest), built + kind-loaded by
  # `skaffold dev`; the GitHub MCP image (ghcr.io/github/github-mcp-server) is pulled
  # from GHCR at runtime. No local artifacts are built by this profile.
  # Deploy: skaffold run -p demo-programming-agent
  # Remove:  helm uninstall programming-agent -n agent-orca-system
  - name: demo-programming-agent
    build:
      artifacts: []
      # hooks:
      #   before: *ensure_kind_build_before
    deploy:
      helm:
        # hooks: *ensure_kind_deploy_hooks
        releases:
          - name: programming-agent
            chartPath: charts/demos/demo-programming-agent
            namespace: agent-orca-system
            setValueTemplates:
              # GitHub PAT (repo read scope). Read from env, never committed.
              githubToken: "{{.AGENT_ORCA_GITHUB_TOKEN}}"
              # Slack incoming webhook URL for the _webhook_notify builtin. The
              # model-router posts to it; no per-user OAuth, no browser, no data
              # residency concerns. See charts/demos/programming-agent/README.md.
              webhookNotify.url: "{{.AGENT_ORCA_WEBHOOK_URL}}"

  # demo-htb-pwn: autonomous HTB red-team pwnbox (MCP toolbelt pattern).
  # A privileged `red-pwnbox` Deployment runs HTB OpenVPN (tun0) + an MCP server
  # exposing the pentest toolbelt; a RESTRICTED openai-compatible `red-commander`
  # AgentDeployment (chat) orchestrates the tools via the model-router. The agent is
  # never privileged — only the dedicated pwnbox pod is.
  #
  # Requires: agent-orca operator + model-providers deployed (skaffold dev -p dev).
  # Provide secrets via env (never commit them):
  #   AGENT_ORCA_DEFAULT_API_KEY=ps-...
  #   AGENT_ORCA_HTB_OVPN_CONFIG="$(cat ~/htb.ovpn)"   # or create the htb-ovpn Secret yourself
  #   AGENT_ORCA_HTB_OVPN_ENDPOINT="nl.free.hackthebox.com:1194"
  #   AGENT_ORCA_REDIS_PASSWORD="..."   # OPTIONAL: shared Redis password so the
  #       red-pwnbox can AUTH to Redis and publish arena-events findings. If unset,
  #       the operator auto-generates a random Redis password (checkpointing via the
  #       model-router still works) and arena-events publish is best-effort/skipped.
  #       Set this to a static value and it backs BOTH the operator's redis.auth.password
  #       AND the pwnbox's REDIS_PASSWORD env.
  # Optional egress gate (default-deny; see plans/...security-mcp-toolbelt):
  #   AGENT_ORCA_PWNBOX_INTERNET_RECON=1   # open external TI/template/wordlist egress (TCP 443)
  # The exploit fetch allowlist (EXPLOIT_FETCH_ALLOWLIST) is operator-managed via
  # values.yaml or `helm install --set-json` — it may contain commas, which break
  # helm's `--set` parser, so it is NOT wired through a skaffold setValueTemplate.
  # Deploy: skaffold run -p demo-htb-pwn
  # Remove:  helm uninstall demo-htb-pwn -n red-team && kubectl delete ns red-team
  #
  # NOTE on images: the default builds files/Dockerfile.pwnbox.blackcart
  # (erdemozgen/blackcart, ~8GB, full toolbelt incl. metasploit/rustscan/SharpHound).
  # With cluster storage sized for it (the kind node needs headroom for the large image
  # ingest), `kind load` works. If local kind chokes on the 8GB ingest, build the slim
  # variant (solid recon/web/exploit belt, metasploit/blackcart-only units report
  # "TOOL MISSING" gracefully) and kind-load it, then point the chart at the slim tag:
  #   docker build -t red-pwnbox:slim -f charts/demos/demo-htb-pwn/files/Dockerfile.pwnbox .
  #   kind load docker-image red-pwnbox:slim --name agent-orca-dev
  #   skaffold run -p demo-htb-pwn -s pwnbox.image.tag=slim -s pwnbox.image.slim=true
  - name: demo-htb-pwn
    build:
      artifacts:
        # Note: with build.local.push=false skaffold loads built images into the
        # kind cluster itself — no hand-rolled kind-load hooks (a ${IMAGE:-
        # $SKAFFOLD_IMAGE style hook resolves to skaffold's underscore image
        # form, which never matches a local docker tag, and a failing hook
        # fails the whole build).
        - image: red-pwnbox
          context: charts/demos/demo-htb-pwn/files
          docker:
            dockerfile: Dockerfile.pwnbox
      # hooks:
      #   before: *ensure_kind_build_before
    deploy:
      helm:
        # hooks: *ensure_kind_deploy_hooks
        releases:
          - name: demo-htb-pwn
            chartPath: charts/demos/demo-htb-pwn
            namespace: red-team
            createNamespace: true
            setValueTemplates:
              # Default API key (providerSecrets[0].name = default-api-key).
              agent-orca-resources.providerSecrets[0].name: "poolside-api-key"
              agent-orca-resources.providerSecrets[0].apiKey: "{{.POOLSIDE_API_KEY}}"
              # HTB OpenVPN config + endpoint -> injected into the htb-ovpn Secret.
              openvpn.ovpnConfig: "{{.AGENT_ORCA_HTB_OVPN_CONFIG}}"
              openvpn.endpoint: "{{.AGENT_ORCA_HTB_OVPN_ENDPOINT}}"
              # Pwnbox egress gate (default deny). Comma-free boolean; the
              # EXPLOIT_FETCH_ALLOWLIST host list is operator-managed via values.yaml
              # or `helm install --set-json` (commas break helm's `--set` parser).
              pwnboxEgress.internetRecon: "{{.AGENT_ORCA_PWNBOX_INTERNET_RECON}}"
              # Mirror the operator's static Redis password so the red-pwnbox can
              # AUTH to Redis for the arena-events findings stream. Must match
              # redis.auth.password set on the agent-orca release above.
              redis.password: "{{.AGENT_ORCA_REDIS_PASSWORD}}"
              # Wire the freshly-built (kind-loaded) pwnbox image into the Deployment.
              pwnbox.image.repository: "{{.IMAGE_REPO_red_pwnbox}}"
              pwnbox.image.tag: "{{.IMAGE_TAG_red_pwnbox}}"
