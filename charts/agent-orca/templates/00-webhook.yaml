{{/*
Self-signed cert generation for the non-cert-manager path.

Variables are computed once here and reused for both the TLS Secret and the
caBundle field in the ValidatingWebhookConfiguration.  The lookup keeps certs
stable across `helm upgrade` — certs are only regenerated when the Secret is
absent (i.e. first install or after manual deletion).
*/}}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if not .Values.webhook.certManager }}
  {{- $secretName := .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "agent-orca.fullname" .)) }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing (index $existing "data") }}
    {{- $caCert = index $existing.data "ca.crt" | b64dec }}
    {{- $tlsCert = index $existing.data "tls.crt" | b64dec }}
    {{- $tlsKey = index $existing.data "tls.key" | b64dec }}
  {{- else }}
    {{- $ca := genCA "agent-orca-webhook-ca" 3650 }}
    {{- $svc := printf "%s-webhook.%s.svc" (include "agent-orca.fullname" .) .Release.Namespace }}
    {{- $cert := genSignedCert $svc nil (list $svc (printf "%s.cluster.local" $svc)) 3650 $ca }}
    {{- $caCert = $ca.Cert }}
    {{- $tlsCert = $cert.Cert }}
    {{- $tlsKey = $cert.Key }}
  {{- end }}
---
# TLS Secret for the webhook server.
# helm.sh/resource-policy: keep preserves certs across helm uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "agent-orca.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ca.crt: {{ $caCert | b64enc }}
  tls.crt: {{ $tlsCert | b64enc }}
  tls.key: {{ $tlsKey | b64enc }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "agent-orca.fullname" . }}-validating
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "agent-orca.fullname" . }}-webhook-cert
  {{- end }}
webhooks:
  - name: vagentrun.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "agent-orca.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-agentorca-agentorca-io-v1alpha1-agentrun
      {{- if not .Values.webhook.certManager }}
      caBundle: {{ $caCert | b64enc }}
      {{- end }}
    rules:
      - apiGroups: ["agentorca.agentorca.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agentruns"]
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    sideEffects: None
  - name: vagent.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "agent-orca.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-agentorca-agentorca-io-v1alpha1-agent
      {{- if not .Values.webhook.certManager }}
      caBundle: {{ $caCert | b64enc }}
      {{- end }}
    rules:
      - apiGroups: ["agentorca.agentorca.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agents"]
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    sideEffects: None
  - name: vtool.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "agent-orca.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-agentorca-agentorca-io-v1alpha1-tool
      {{- if not .Values.webhook.certManager }}
      caBundle: {{ $caCert | b64enc }}
      {{- end }}
    rules:
      - apiGroups: ["agentorca.agentorca.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tools"]
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    sideEffects: None
  - name: vsandboxclass.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ include "agent-orca.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-agentorca-agentorca-io-v1alpha1-sandboxclass
      {{- if not .Values.webhook.certManager }}
      caBundle: {{ $caCert | b64enc }}
      {{- end }}
    rules:
      - apiGroups: ["agentorca.agentorca.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxclasses"]
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    sideEffects: None
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-orca.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      appProtocol: https
  selector:
    {{- include "agent-orca.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-orca.fullname" . }}-internal-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
spec:
  ports:
    - name: internal-api
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: ui-api
      port: 8083
      targetPort: 8083
      protocol: TCP
    {{- if .Values.externalAPI.enabled }}
    - name: external-api
      port: {{ .Values.externalAPI.port | default 8084 }}
      targetPort: {{ .Values.externalAPI.port | default 8084 }}
      protocol: TCP
    {{- end }}
    - name: acp-api
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    {{- include "agent-orca.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
