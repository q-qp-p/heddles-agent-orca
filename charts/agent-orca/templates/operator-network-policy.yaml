apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-orca.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-orca.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  policyTypes:
    - Ingress
    {{- if .Values.operator.networkPolicy.oidcEgress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
      - namespaceSelector:
          matchExpressions:
          - key: namespace
            operator: In
            values: ["kube-system"]
    # Port 8080: metrics — allow from namespaces labeled metrics: enabled.
    # controller-runtime serves the operator's metrics insecurely on :8080
    # (--metrics-secure=false, see deployment.yaml); the metrics Service targets
    # this port, and the ServiceMonitor/PodMonitor scrape through it.
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: 8080
          protocol: TCP
    # Port 9443: webhook — allow from any (kube-apiserver calls webhooks)
    - ports:
        - port: 9443
          protocol: TCP
    # Port 8082: internal API — allow from agent run pods in any namespace (pods labeled
    # agentorca.io/run) and from AgentDeployment pods (labeled agentdeployment.agentorca.io).
    # A deployment's model-router posts routing events and benchmark samples here too.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: agentorca.io/run
                operator: Exists
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: agentdeployment.agentorca.io
                operator: Exists
      ports:
        - port: 8082
          protocol: TCP
    # Port 8083: UI API — allow only from ui-proxy pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "agent-orca.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ui
      ports:
        - port: 8083
          protocol: TCP
    {{- if .Values.externalAPI.enabled }}
    # Port 8084: external API — allow from configurable sources
    - ports:
        - port: {{ .Values.externalAPI.port | default 8084 }}
          protocol: TCP
    {{- end }}
    # Port 8000: ACP API — allow from any source (same as External API on :8084).
    # The Ingress routes /agents, /runs, /sessions, /session/ to this port for
    # aoctl and ACP-compatible editor integrations (see ui-ingress.yaml). Without
    # this rule the nginx ingress controller cannot reach the ACP API server and
    # requests to /agents, /runs, etc. hang until proxy-connect-timeout expires
    # (504 Gateway Timeout "while connecting to upstream").
    - ports:
        - port: 8000
          protocol: TCP
    {{- if .Values.operator.networkPolicy.oidcEgress.enabled }}
  # Egress: allow the operator to reach its OIDC IdP(s) for JWKS discovery and
  # token introspection. K8s NetworkPolicy is CIDR-only (no URL/hostname egress),
  # so supply the IdP host CIDR (0.0.0.0/0 in dev). The kube-apiserver/DNS rules
  # below keep TokenReview and DNS working when this isolation is active.
  egress:
    - to:
      - namespaceSelector:
          matchExpressions:
          - key: namespace
            operator: In
            values: ["kube-system"]
    {{- range .Values.operator.networkPolicy.oidcEgress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
    {{- if .Values.openshell.enabled }}
    # OpenShell gateway gRPC API, for sandboxed agents.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "agent-orca.openshell.gatewayNamespace" . }}
      ports:
        - port: {{ .Values.openshell.gateway.port }}
          protocol: TCP
    {{- end }}
    {{- end }}
