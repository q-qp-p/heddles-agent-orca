---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agentruns.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.contextUsedTokens
      name: Context
      type: integer
    - jsonPath: .status.spendUSD
      name: Spend
      type: string
    - jsonPath: .status.restartCount
      name: Restarts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is an instantiation of an Agent executing a specific
          task.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRunSpec defines the desired state of an AgentRun.
            properties:
              agentRef:
                description: AgentRef names the Agent to run.
                minLength: 1
                type: string
              budget:
                description: |-
                  Budget caps the run's model spend. When the cap is reached the run fails or
                  pauses for approval, per budget.onExceeded. Without it the run is not capped
                  (the ModelSelector's budgetCap only steers routing).
                properties:
                  approverGroups:
                    description: |-
                      ApproverGroups are the identity-provider groups whose members may decide a
                      raise. Empty lets any user with access to the run's namespace decide.
                    items:
                      type: string
                    type: array
                  maxUSD:
                    description: 'MaxUSD is the spend, in USD, at which the run fails
                      or pauses. Example: "2.50".'
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  onExceeded:
                    default: fail
                    description: |-
                      OnExceeded is what happens at the cap: "fail" (default) halts the run;
                      "pause" holds it until an approver raises the cap or the pause times out.
                      Pausing needs PostgreSQL (approvals are stored there); without it a run that
                      reaches its cap fails.
                    enum:
                    - fail
                    - pause
                    type: string
                  pauseTimeout:
                    description: |-
                      PauseTimeout is how long a paused run waits for a decision before it fails.
                      Default 24h.
                    type: string
                  raiseByUSD:
                    description: RaiseByUSD is how much one approval adds to the cap.
                      Defaults to MaxUSD.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  warnAtPercent:
                    default: 80
                    description: |-
                      WarnAtPercent is the share of the cap at which a warning is emitted (a
                      trace event and a Kubernetes event). Default 80.
                    maximum: 99
                    minimum: 1
                    type: integer
                required:
                - maxUSD
                type: object
              callbacks:
                description: Callbacks configures webhooks invoked on run completion.
                properties:
                  onComplete:
                    description: OnComplete is a URL that receives a POST when the
                      run succeeds.
                    type: string
                  onFailed:
                    description: OnFailed is a URL that receives a POST when the run
                      fails.
                    type: string
                type: object
              egress:
                description: |-
                  Egress configures durable result delivery to an external message bus
                  (Kafka, Pub/Sub, or Redis stream) on terminal phase. When set, the
                  controller publishes the final TaskResponse to the configured sink.
                  Independent of webhook callbacks — both can be configured simultaneously.
                properties:
                  address:
                    description: |-
                      Address is the Redis connection address (redis only).
                      Example: "redis-master:6379"
                    type: string
                  brokers:
                    description: |-
                      Brokers is the list of broker addresses (kafka only).
                      Example: ["kafka:9092"]
                    items:
                      type: string
                    type: array
                  key:
                    description: |-
                      Key is the partition key for the published message (kafka only).
                      If empty, the run ID is used as the key.
                    type: string
                  projectID:
                    description: ProjectID is the GCP project ID (pubsub only).
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references a Secret containing connection credentials.
                      The Secret must be in the same namespace as the AgentRun.
                      For Kafka: key "sasl-username" and "sasl-password" (or "tls-cert"/"tls-key").
                      For Pub/Sub: key "credentials" containing a service-account JSON blob.
                      For Redis: key "password".
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret. Defaults to the same
                          namespace as the referencing resource.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  topic:
                    description: |-
                      Topic is the destination topic/queue/stream name.
                      For Kafka: the topic name. For Pub/Sub: the topic name. For Redis: the stream name.
                    minLength: 1
                    type: string
                  type:
                    allOf:
                    - enum:
                      - kafka
                      - pubsub
                      - redis
                    - enum:
                      - kafka
                      - pubsub
                      - redis
                    description: 'Type is the sink type: kafka, pubsub, or redis.'
                    type: string
                required:
                - topic
                - type
                type: object
              input:
                description: Input is the user task passed to the agent process via
                  the AGENTORC_INPUT env var.
                minLength: 1
                type: string
              parentRunRef:
                description: |-
                  ParentRunRef is the name of the parent AgentRun when this run was spawned
                  by an orchestrator agent via the agent-as-tool pattern.
                  Set automatically by the tool executor; do not set manually.
                type: string
              priorRunRef:
                description: |-
                  PriorRunRef is the name of the previous AgentRun in this chat session.
                  When set, the model-router loads that run's accumulated message checkpoint as
                  the initial conversation history, enabling multi-turn context across runs.
                  Set automatically by the deployment chat API; do not set manually.
                type: string
              restartPolicy:
                description: RestartPolicy controls failure recovery behaviour.
                properties:
                  maxRetries:
                    default: 3
                    description: MaxRetries is the number of times to restart a failed
                      pod before marking the run Failed.
                    type: integer
                type: object
              safeguards:
                description: |-
                  Safeguards configures behavioral guardrails that halt the run when the agent
                  appears stuck in a loop or making no progress.
                properties:
                  maxConsecutiveNoopTurns:
                    description: |-
                      MaxConsecutiveNoopTurns halts the run if the LLM produces this many consecutive
                      turns with no tool calls and fewer than MinSubstantiveTokens output tokens.
                      Not applied to chat (http input) runs. Unset uses the default of 15; a
                      negative value disables the check.
                    type: integer
                  maxRepeatedToolCalls:
                    description: |-
                      MaxRepeatedToolCalls halts the run if the same tool is called with identical
                      arguments this many times within the run. Unset uses the default of 50; a
                      negative value disables the check.
                    type: integer
                  minSubstantiveTokens:
                    default: 20
                    description: |-
                      MinSubstantiveTokens is the minimum number of output tokens required for a turn
                      to count as substantive. Only evaluated when MaxConsecutiveNoopTurns > 0.
                    type: integer
                  toolExecutionTimeoutSec:
                    default: 60
                    description: |-
                      ToolExecutionTimeoutSec is the maximum number of seconds a single tool call may
                      take before it is cancelled and a structured error is returned to the LLM.
                      This prevents a hanging tool (e.g. blocking I/O, deadlock) from stalling the
                      entire run. Defaults to 60. 0 means use the default.
                    type: integer
                  toolFrequencyCap:
                    description: |-
                      ToolFrequencyCap halts the run if any single tool is called more than this many
                      times in total across the run. Unset (the default) or a negative value
                      disables the check.
                    type: integer
                type: object
              timeout:
                description: Timeout is the maximum duration for this run. Defaults
                  to 5 minutes.
                type: string
              workflowSandbox:
                description: |-
                  WorkflowSandbox runs the agent in an existing workflow sandbox instead of
                  creating a sandbox whose main process is the agent. Set only by the
                  AgentWorkflow controller and inherited by clarification continuations.
                properties:
                  fresh:
                    description: |-
                      Fresh is true for the step's dedicated sandbox. It is deleted when the last
                      run in a clarification chain ends; a shared sandbox is workflow-owned.
                    type: boolean
                  id:
                    description: ID is the gateway sandbox ID, used for router ingress.
                    type: string
                  name:
                    description: Name is the gateway sandbox name.
                    minLength: 1
                    type: string
                  providerOwner:
                    description: |-
                      ProviderOwner is the original step AgentRun name used for tool credential
                      providers. Continuations retain it so their policy and providers still match.
                    type: string
                required:
                - name
                type: object
            required:
            - agentRef
            - input
            type: object
          status:
            description: AgentRunStatus defines the observed state of an AgentRun.
            properties:
              budget:
                description: Budget is the run's standing against spec.budget.
                properties:
                  capUSD:
                    description: |-
                      CapUSD is the current cap: spec.budget.maxUSD plus the approved raises. Only
                      the operator sets it, never the model-router.
                    type: string
                  raises:
                    description: Raises counts the approved raises.
                    type: integer
                  spentUSD:
                    description: SpentUSD is the spend the model-router last reported.
                    type: string
                  state:
                    description: State is ok, warning (past warnAtPercent) or exceeded
                      (paused or failing).
                    enum:
                    - ok
                    - warning
                    - exceeded
                    type: string
                  updatedAt:
                    description: UpdatedAt is when the router last reported.
                    format: date-time
                    type: string
                required:
                - capUSD
                - state
                type: object
              checkpointRef:
                description: |-
                  CheckpointRef is the storage key of the latest conversation checkpoint.
                  Used by the controller to resume a failed run.
                type: string
              childRunRefs:
                description: ChildRunRefs lists the names of child AgentRuns spawned
                  by this run.
                items:
                  type: string
                type: array
              clarifyAnswer:
                description: ClarifyAnswer is the human's response, set via the UI
                  API.
                type: string
              clarifyQuestion:
                description: ClarifyQuestion is the question posed to the human when
                  Phase is WaitingForInput.
                type: string
              completionTime:
                description: CompletionTime is when the run reached a terminal phase.
                format: date-time
                type: string
              conditions:
                description: Conditions holds standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contextUsedTokens:
                description: |-
                  ContextUsedTokens is the estimated token count of the conversation context.
                  Updated by the model-router at runtime and reflects the current size of the
                  accumulated message history.
                type: integer
              continuationRunRef:
                description: |-
                  ContinuationRunRef is the name of the follow-up AgentRun created when
                  the human answers a clarifying question. The original run stays in
                  WaitingForInput (for audit) and the continuation carries the work forward.
                type: string
              episodicChunks:
                description: EpisodicChunks is the number of episodic memory summaries
                  generated during this run.
                type: integer
              failureReason:
                description: |-
                  FailureReason is a human-readable explanation of why the run failed,
                  set by the agent via the _fail built-in tool.
                type: string
              handoffTarget:
                description: HandoffTarget is the Agent name this run handed off to,
                  if Phase is HandedOff.
                type: string
              inputMode:
                description: |-
                  InputMode mirrors Agent.spec.runtime.inputMode, cached here so the controller
                  does not need to re-fetch the Agent in handlePodSuccess.
                type: string
              lastRestartReason:
                description: LastRestartReason describes why the pod was last restarted.
                type: string
              loopDetected:
                description: |-
                  LoopDetected is set when the run was halted by a safeguard trip.
                  The run phase will be Failed when this is set.
                properties:
                  reason:
                    description: Reason is a human-readable description of which safeguard
                      was tripped.
                    type: string
                  toolName:
                    description: ToolName is the name of the tool involved, for tool-based
                      trips.
                    type: string
                  tripCount:
                    description: TripCount is the counter value that exceeded the
                      configured limit.
                    type: integer
                required:
                - reason
                - tripCount
                type: object
              maxContextTokens:
                description: |-
                  MaxContextTokens is the maximum context window size for the selected model.
                  Used to calculate how much context is available for the conversation.
                type: integer
              output:
                description: |-
                  Output is the agent's final output captured from pod stdout.
                  Truncated to 10KB; full output is in the checkpoint store.
                type: string
              phase:
                description: Phase is the current lifecycle phase of this run.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - HandedOff
                - WaitingForInput
                type: string
              podName:
                description: PodName is the name of the agent pod for this run.
                type: string
              rawOutput:
                description: |-
                  RawOutput is the raw pod stdout, useful for debugging.
                  Truncated to 4KB.
                type: string
              restartCount:
                description: RestartCount is the number of times this run's pod has
                  been restarted.
                type: integer
              routerPodName:
                description: |-
                  RouterPodName is the name of the model-router pod when split-pod topology is active.
                  Empty when using the default combined-pod (sidecar) topology.
                type: string
              routingDecisions:
                description: |-
                  RoutingDecisions records the model routing decisions made during this run.
                  Populated by the controller from the resolved ModelSelector configuration
                  and updated by the model-router sidecar at runtime. It holds the most
                  recent decisions only (see RoutingDecisionsTotal).
                items:
                  description: RoutingDecision records a single model routing decision
                    made during an AgentRun.
                  properties:
                    category:
                      description: Category is the task stage the request was classified
                        as.
                      type: string
                    confidence:
                      description: Confidence is a 0.0–1.0 score indicating routing
                        confidence.
                      type: string
                    decisionID:
                      description: DecisionID identifies this decision across traces,
                        status and telemetry.
                      type: string
                    model:
                      description: Model is the selected model identifier (e.g. "anthropic/claude-sonnet-4-6").
                      type: string
                    parentDecisionID:
                      description: ParentDecisionID is the decision a fallback replaced.
                      type: string
                    path:
                      description: 'Path names what decided: a rule path, the meta-router,
                        or a fallback.'
                      type: string
                    provider:
                      description: Provider is the ModelProvider CRD name that was
                        selected.
                      type: string
                    reason:
                      description: Reason is a human-readable explanation of why this
                        provider was chosen.
                      type: string
                    strategy:
                      description: Strategy is the routing strategy used (e.g. "rule-based",
                        "llm-meta", "hybrid").
                      type: string
                    timestamp:
                      description: Timestamp is when the routing decision was made.
                      format: date-time
                      type: string
                  required:
                  - model
                  - provider
                  type: object
                type: array
              routingDecisionsTotal:
                description: |-
                  RoutingDecisionsTotal counts every decision recorded during this run,
                  including those that have rolled out of RoutingDecisions.
                type: integer
              sandboxDecisionsSeen:
                description: |-
                  SandboxDecisionsSeen is the time of the last sandbox network decision
                  copied into the run's trace; the next read continues after it.
                format: date-time
                type: string
              sandboxGitTokenExpiry:
                description: |-
                  SandboxGitTokenExpiry is when the run's current GitHub installation token
                  expires (spec.runtime.sandbox.github). The operator mints a new one before
                  then.
                format: date-time
                type: string
              sandboxName:
                description: |-
                  SandboxName is the sandbox runtime's name for this run's sandbox when
                  spec.runtime.sandbox is set on the Agent. Empty otherwise.
                type: string
              spendUSD:
                description: SpendUSD is the total USD spend for this run so far,
                  updated periodically.
                type: string
              startTime:
                description: StartTime is when the agent pod started.
                format: date-time
                type: string
              waitingSince:
                description: |-
                  WaitingSince records when the run entered WaitingForInput.
                  Used to enforce a waiting timeout separate from the run timeout.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
