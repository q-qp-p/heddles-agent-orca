---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sandboxclasses.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: SandboxClass
    listKind: SandboxClassList
    plural: sandboxclasses
    singular: sandboxclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.enforcement
      name: Enforcement
      type: string
    - jsonPath: .spec.egressPresets
      name: Presets
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SandboxClass is a cluster-wide sandbox profile: egress, filesystem, resource
          defaults, placement and minimum enforcement. Agents use one with
          spec.runtime.sandbox.classRef and may add to it, but not weaken it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SandboxClassSpec is a reusable sandbox profile set by cluster
              admins.
            properties:
              approval:
                description: |-
                  Approval governs requests for egress the policy does not allow: a
                  sandbox that tries to reach an unlisted host gets a proposed rule, which
                  an auto-approve rule or an approver may allow while the run continues.
                  Without it such requests stay denied.
                properties:
                  approverGroups:
                    description: |-
                      ApproverGroups are the identity-provider groups whose members may decide.
                      Empty lets any user with access to the run's namespace decide.
                    items:
                      type: string
                    type: array
                  autoApprove:
                    description: |-
                      AutoApprove allows matching requests without a person. A request the
                      sandbox's policy prover flags with security notes is never auto-approved.
                    items:
                      description: SandboxAutoApproveRule matches egress requests
                        to approve automatically.
                      properties:
                        binaries:
                          description: Binaries the requesting process may be (absolute
                            paths). Empty matches any.
                          items:
                            type: string
                          type: array
                        host:
                          description: Host is the destination host, or a wildcard
                            such as *.example.com.
                          minLength: 1
                          type: string
                        ports:
                          description: Ports the request may name. Default [443].
                          items:
                            format: int32
                            type: integer
                          type: array
                      required:
                      - host
                      type: object
                    type: array
                  timeout:
                    description: |-
                      Timeout is how long a request waits for a decision before it is rejected.
                      Default 30m.
                    type: string
                type: object
              credentials:
                description: |-
                  Credentials are secrets the class's sandboxes may use without holding.
                  The sandbox gets a placeholder; the supervisor swaps in the real value
                  only on requests to the credential's bound endpoint. Every sandbox made
                  from the class gets all of them, and no Agent or workflow can add one.
                items:
                  description: SandboxCredential is a secret a sandbox can use but
                    never see.
                  properties:
                    bind:
                      description: Bind is the only place the value works.
                      properties:
                        binaries:
                          description: |-
                            Binaries are the executables (absolute paths) that may use the value.
                            Empty lets any process in the sandbox use it.
                          items:
                            type: string
                          type: array
                        host:
                          description: |-
                            Host is the exact destination host. It must be reachable under the
                            class's egress rules or presets: a credential binds an endpoint, it does
                            not open one.
                          minLength: 1
                          pattern: ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$
                          type: string
                        paths:
                          description: |-
                            Paths limits the value to requests whose URL path matches one of these
                            globs (e.g. /heddles/agent-orca.git/**). Empty means any path.
                          items:
                            type: string
                          type: array
                        port:
                          default: 443
                          description: Port is the destination port. Default 443.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                      required:
                      - host
                      type: object
                    inject:
                      description: |-
                        Inject says how the value is presented to the endpoint. The default is
                        bearer. The process sends the placeholder (the AGENTORCA_CRED_<NAME>
                        environment variable) in the matching header and the supervisor swaps in
                        the real value on the bound endpoint.
                      properties:
                        name:
                          description: Name is the header for style header, e.g. X-Api-Key.
                          type: string
                        style:
                          description: |-
                            Style is bearer (Authorization: Bearer <value>), basic (Authorization:
                            Basic, with the value as the password; the client chooses the user) or
                            header (the value alone in the named header).
                          enum:
                          - bearer
                          - basic
                          - header
                          type: string
                      required:
                      - style
                      type: object
                      x-kubernetes-validations:
                      - message: style header needs a header name
                        rule: self.style != 'header' || (has(self.name) && size(self.name)
                          > 0)
                      - message: name applies to style header only
                        rule: self.style == 'header' || !has(self.name)
                    name:
                      description: |-
                        Name identifies the credential within the class. It names the placeholder
                        environment variable, AGENTORCA_CRED_<NAME> (upper case, dashes as
                        underscores).
                      pattern: ^[a-z][a-z0-9-]{0,30}$
                      type: string
                    source:
                      description: Source is where the real value comes from.
                      properties:
                        githubApp:
                          description: |-
                            GitHubApp is an installation token of the operator's GitHub App, narrowed
                            to the listed repositories and valid for one hour. The operator renews it.
                          properties:
                            permissions:
                              additionalProperties:
                                description: SandboxCredentialPermission is the level
                                  of one GitHub App permission.
                                enum:
                                - read
                                - write
                                type: string
                              description: |-
                                Permissions are the token's repository permissions. The token is usable
                                only for git over HTTPS (clone, fetch and, with contents: write, push) to
                                the listed repositories, so only contents is accepted. Default is
                                contents: read.
                              maxProperties: 20
                              type: object
                            repositories:
                              description: |-
                                Repositories are "owner/name" slugs, all under the owner the operator's
                                GitHub App is installed on.
                              items:
                                type: string
                              maxItems: 50
                              minItems: 1
                              type: array
                          required:
                          - repositories
                          type: object
                        secretRef:
                          description: SecretRef is a key of a Kubernetes Secret.
                          properties:
                            key:
                              description: Key is the key in the Secret's data.
                              minLength: 1
                              type: string
                            name:
                              description: Name is the Secret's name.
                              minLength: 1
                              type: string
                            namespace:
                              description: |-
                                Namespace is where the Secret lives. Empty means the namespace of the
                                workload that uses the class, so each tenant's workloads get their own
                                value. A namespace must be one of the allowedNamespaces of the TenantConfig
                                the workload's namespace belongs to; the operator checks that when it
                                creates the sandbox.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of githubApp or secretRef
                        rule: '(has(self.githubApp) ? 1 : 0) + (has(self.secretRef)
                          ? 1 : 0) == 1'
                  required:
                  - bind
                  - name
                  - source
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              egress:
                description: |-
                  Egress adds endpoints every Agent of the class may reach, on top of the
                  Agent's own.
                items:
                  description: SandboxEgressRule allows the agent to reach one host.
                  properties:
                    access:
                      default: read-only
                      description: |-
                        Access selects the permitted HTTP operations. read-only (the default) allows
                        GET/HEAD/OPTIONS, enough for package downloads; git clone over HTTPS POSTs,
                        so it needs read-write.
                      enum:
                      - read-only
                      - read-write
                      - full
                      type: string
                    binaries:
                      description: |-
                        Binaries restricts the rule to these executables (absolute paths, e.g.
                        /usr/bin/git). Empty means any binary in the sandbox.
                      items:
                        type: string
                      type: array
                    host:
                      description: Host is the destination hostname. Wildcards like
                        "*.pythonhosted.org" are supported.
                      minLength: 1
                      type: string
                    ports:
                      description: Ports lists the destination ports. Defaults to
                        [443].
                      items:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      type: array
                  required:
                  - host
                  type: object
                type: array
              egressPresets:
                description: EgressPresets add vetted read-only host lists, e.g. go
                  or npm.
                items:
                  description: SandboxEgressPreset names a vetted set of package-registry
                    and source hosts.
                  enum:
                  - go
                  - npm
                  - pypi
                  - crates
                  - maven
                  - github-read
                  - mise
                  type: string
                type: array
              enforcement:
                description: |-
                  Enforcement is the minimum network enforcement for Agents of this class:
                  with enforce, an Agent cannot weaken it to audit.
                enum:
                - audit
                - enforce
                type: string
              filesystem:
                description: Filesystem adds paths every Agent of the class gets.
                properties:
                  readOnly:
                    description: ReadOnly lists extra directories the agent may read.
                    items:
                      type: string
                    type: array
                  readWrite:
                    description: ReadWrite lists extra directories the agent may read
                      and write.
                    items:
                      type: string
                    type: array
                type: object
              namespaceSelector:
                description: |-
                  NamespaceSelector limits which namespaces' Agents may use the class. Empty
                  allows every namespace that has opted in to sandboxes.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector, Tolerations, RuntimeClassName and PriorityClassName place the
                  class's sandbox pods, replacing the operator-wide openshell.placement. They
                  live here, not on the Agent, because a toleration can admit a pod to any
                  tainted node; the class is cluster-scoped, so only cluster admins set them.
                  They need the gateway's drivers.kubernetes.allowDriverConfig.
                type: object
              priorityClassName:
                type: string
              resources:
                description: Resources are the defaults for Agents that set no spec.resources.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtimeClassName:
                type: string
              tolerations:
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
