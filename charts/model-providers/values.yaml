  # ════════════════════════════════════════════════════════════════════════════
  # Ollama (in-cluster)
  # Deploy ollama-embedding-cluster.yaml first to run Ollama in the cluster.
  # Best for local development and testing without external API costs.
  # https://ollama.com/library
  # ════════════════════════════════════════════════════════════════════════════

  # nomic-embed-text — local embedding model (768-dim)
  # Model is pre-pulled by the ollama-pull-model Job when you deploy
  # ollama-embedding-cluster.yaml
  #
  # nomic-embed-text requires task-specific prefixes: documents must start with
  # "search_document: " and queries with "search_query: ". Without these prefixes,
  # embeddings are produced in the wrong vector space and retrieval quality
  # degrades significantly.
  #
  # Two Ollama gotchas (from the model card):
  # 1. The native context window is 8,192 tokens, but the Ollama model card
  #    lists 2,048. Set num_ctx: 8192 in the Modelfile to use the full window.
  # 2. The model requires task prefixes (set below as queryPrompt/docPrompt).
  - name: ollama-nomic-embed-text
    enabled: false
    litellmModel: "ollama/nomic-embed-text"
    baseURL: "http://ollama-embed.agent-orca-system.svc:11434"
    credentialsRef:
      existingSecret: "ollama-embed-credentials"
      key: "api-key"
    capabilities:
      - embeddings
    latencyProfile: fast
    constraints:
      contextWindow: 8192
      costPerMillionInputTokens: "0"
      costPerMillionOutputTokens: "0"
    queryPrompt: "search_query: "
    docPrompt: "search_document: "

# ─────────────────────────────────────────────────────────────────────────────
# Model Selectors
# Pre-built routing policies.  Enable those that match the model providers
# you have activated above.
#
# providers[].name must match a ModelProvider .name value above.
# ─────────────────────────────────────────────────────────────────────────────
modelSelectors:

  # default — balanced quality/cost, multi-provider fallback
  # Enable if you have at least one of: claude-sonnet-5-5, gpt-6.1-sol, gemini-3.8-flash
  - name: default
    enabled: true
    strategy: rule-based
    providers:
      - name: openrouter-free
        weight: 80
      - name: anthropic-claude-sonnet-5-5
        weight: 60
      - name: openai-gpt-6-1-sol
        weight: 40
      - name: openrouter-ling-3-0-flash
        weight: 50
      - name: openrouter-glm-5-3-flash
        weight: 50
      - name: openrouter-qwen3-7-flash
        weight: 50
      - name: openrouter-deepseek-v4-1-flash
        weight: 50
      - name: openrouter-nemotron-3-5-lightning
        weight: 50
      - name: openrouter-mercury-3
        weight: 50
      - name: openrouter-minimax-m3-1-flash
        weight: 50
      - name: openrouter-nemotron-3-5-super-vl
        weight: 50
      - name: openrouter-mimo-v2-6-pro
        weight: 50
      - name: openrouter-qwen3-8-27b
        weight: 50
      - name: openrouter-seed-2-0-code
        weight: 50
      - name: openrouter-glm-5-3
        weight: 50
      - name: openrouter-mistral-large-4
        weight: 50
      - name: openrouter-gemini-3-8-flash
        weight: 50
      - name: openrouter-claude-haiku-5-5
        weight: 50
      - name: openrouter-gpt-6-1-terra
        weight: 50
      - name: openrouter-grok-4-7
        weight: 50
      - name: openrouter-qwen3-8-max
        weight: 50
      - name: openrouter-kimi-k3-1-pro
        weight: 50
      - name: openrouter-claude-sonnet-5-5
        weight: 50
      - name: openrouter-claude-opus-5-5
        weight: 50
    fallbackChain:
      - google-gemini-3-8-flash
      - anthropic-claude-haiku-5-5
      - openrouter-free

  # openrouter-switchyard — NVIDIA NeMo Switchyard over the OpenRouter models.
  # A small judge scores each task: an easy one starts on the cheap model, a hard
  # one on the capable model, and the stage router escalates after repeated tool
  # failures. When Switchyard cannot decide, the rule router picks from the
  # providers below. See docs/switchyard-routing.md.
  - name: openrouter-switchyard
    enabled: true
    strategy: switchyard
    providers:
      - name: openrouter-deepseek-v4-1-flash
        weight: 100
      - name: openrouter-claude-sonnet-5-5
        weight: 100
      - name: openrouter-glm-5-3-flash
        weight: 0   # judge only, never answers
      # Mid tier and alternates. Switchyard's composite algorithm routes to the
      # capable and efficient targets below; these are the pool the rule router
      # falls back on and the models the fallback chain can reach.
      - name: openrouter-claude-haiku-5-5
        weight: 60
      - name: openrouter-gemini-3-8-flash
        weight: 50
      - name: openrouter-qwen3-7-flash
        weight: 50
      - name: openrouter-glm-5-3
        weight: 40
      - name: openrouter-mimo-v2-6-pro
        weight: 40
      - name: openrouter-gpt-6-1-terra
        weight: 30
      - name: openrouter-kimi-k3-1-pro
        weight: 30
    fallbackChain:
      - openrouter-claude-sonnet-5-5
      - openrouter-claude-haiku-5-5
      - openrouter-gemini-3-8-flash
      - openrouter-deepseek-v4-1-flash
      - openrouter-qwen3-7-flash
      - openrouter-free
    capabilityRouting:
      capable: openrouter-claude-sonnet-5-5
      efficient: openrouter-deepseek-v4-1-flash
      judge: openrouter-glm-5-3-flash
    switchyard:
      type: composite
      classifier:
        target: openrouter-glm-5-3-flash
        base_threshold: 0.5
        classify_trigger: user_turn
        fail_open: true
      stage:
        capable_target: openrouter-claude-sonnet-5-5
        efficient_target: openrouter-deepseek-v4-1-flash
        confidence_threshold: 0.5

  # fast — lowest latency, optimised for interactive / high-volume workloads
  - name: fast
