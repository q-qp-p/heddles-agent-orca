{{- /*
github-mcp-token — holds the GitHub PAT consumed by the github-mcp MCPServer
(stdio sidecar) via envFrom secretKeyRef → GITHUB_PERSONAL_ACCESS_TOKEN.

The value is supplied at deploy time and is NEVER committed to the chart.
Under Skaffold it is wired from the AGENT_ORCA_GITHUB_TOKEN env var; with plain
Helm use:  helm install ... --set githubToken=ghp_...
*/ -}}
{{- if .Values.githubToken }}
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.githubToken | quote }}
{{- else }}
  {{- /* Emit a placeholder so the MCPServer's envFrom still resolves when no token
          is provided — the github-mcp sidecar will then fail its tool calls with a
          clear 401 rather than the pod failing to schedule on a missing Secret. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    note: "githubToken is not set; GitHub MCP tools will return 401. Set githubToken (skaffold: AGENT_ORCA_GITHUB_TOKEN)."
type: Opaque
stringData:
  token: ""
{{- end }}
