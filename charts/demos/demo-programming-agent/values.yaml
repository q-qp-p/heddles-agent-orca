nameOverride: ""

# GitHub PAT (repo read scope) for the GitHub MCP server. NOT committed — injected
# at deploy time. Under Skaffold: skaffold wires AGENT_ORCA_GITHUB_TOKEN into this
# value via a setValueTemplate. With plain Helm: --set githubToken=ghp_xxx
githubToken: ""

# Slack incoming webhook (team notification). The senior-programmer agent posts to a
# shared Slack channel via the _webhook_notify builtin tool, which POSTs to this URL.
# No per-user OAuth / browser flow, no data residency concerns: the webhook URL is the
# only credential and is scoped to posting in its channel. NOT committed — injected at
# deploy time via Skaffold setValueTemplates (AGENT_ORCA_WEBHOOK_URL) or via Helm
# --set webhookNotify.url=...
webhookNotify:
  url: ""                  # Slack incoming-webhook URL (skaffold: AGENT_ORCA_WEBHOOK_URL)

agent-orca-resources:
  # ── MCPServers ────────────────────────────────────────────────────────────────
  #
  # github-mcp: the official GitHub MCP server (ghcr.io/github/github-mcp-server)
  # running as a read-only stdio sidecar injected into the senior-programmer agent
  # pod. The model-router mounts the image via an image volume and fork/execs the
  # binary at args[0] (the absolute path inside the image); every subsequent arg is
  # a server flag. `envFrom` injects GH_TOKEN from the github-mcp-token Secret
  # (created from .githubToken by github-token-secret.yaml).
  #
  # NAMING CONVENTION (auto-discovery is the default):
  #   * agent.tools             -> reference the MCPServer by NAME (e.g. "github-mcp").
  #     With spec.discoverability: enabled (default) and no spec.tools, the controller
  #     creates a single connector Tool CR named "github-mcp"; the model-router then
  #     discovers every tool the server exposes (tools/list) and forwards the real
  #     names to the LLM.
  #   * --tools arg / GITHUB_TOKEN env -> the server's REAL tool names
  #     (get_file_contents, underscore) — what the server expects and what the LLM calls.
  #   * includePatterns/excludePatterns -> optional globs narrowing which discovered
  #     tools reach the LLM (e.g. "search_*"); applied at runtime after tools/list.
  # To opt back into per-tool Tool CRs (agent references github-mcp-<name>), set
  # spec.discoverability: disabled and declare spec.tools explicitly.
  #
  # Allowed tools (all read-only, from the `repos` toolset):
  #   get-file-contents  read a file/directory at path in owner/repo
  #   search-code        GitHub code search (qualifiers: repo:, org:, language:, path:, filename:, extension:)
  #   list-commits       list commits on owner/repo (optionally by path/sha/since/until)
  #   get-commit         details for a single commit (owner/repo/commit_sha)
  #   list-branches      list branches on owner/repo
  #   search-commits     GitHub commit search (repo:owner/repo, author:, etc.)
  mcpServers:
    - name: github-mcp
      transport: stdio
      ociRef: "ghcr.io/github/github-mcp-server:latest"
      # args[0] is the binary path inside the image (model-router rewrites it into
      # the /mcp-img/<tool> image-volume mount before fork/exec). `stdio` is the
      # server subcommand; --read-only blocks all mutating tools; --tools restricts
      # to the read-only allow-list using the server's REAL (underscore) tool names.
      #
      args:
        - /server/github-mcp-server
        - stdio
      envFrom:
        - name: GITHUB_PERSONAL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-mcp-token
              key: token
        - name: GITHUB_TOOLSETS
          value: "all"
      # The agent may call these tools directly; the _controller principal is
      # required so the KnowledgeBase MCP-ingestion Jobs (if enabled later) can too.
      allowedAgents:
        - senior-programmer
        - _controller
      # GitHub MCP is reached over the public API; the per-run NetworkPolicy needs
      # an explicit egress rule to allow it.
      networkEgress:
        - host: api.github.com
          port: 443
          protocol: TCP
      # Discovery: spec.tools is empty (below) so the controller creates a single
      # connector Tool CR named "github-mcp"; the model-router discovers all of the
      # server's tools at runtime and exposes them to the LLM.
      tools: []
      #   # Hyphenated (K8s-valid) — these become Tool CRs github-mcp-<name>.
      #   - name: get-file-contents
      #     description: >
      #       Read a file or directory from a GitHub repository (owner/repo). Returns file content (with a
      #       base64 blob + text) for files or a JSON array of entries (name, type, path) for directories.
      #       Parameters: owner, repo, path, ref (optional).
      #   - name: search-code
      #     description: >
      #       Search GitHub code. Supports qualifiers repo:, org:, language:, path:, filename:, extension:,
      #       in:file, size:, is:archived. Returns matching files with repository, path, html_url, and
      #       a text_matches snippet. Parameters: query, owner (optional), repo (optional), page, perPage.
      #   - name: list-commits
      #     description: >
      #       List commits for owner/repo, optionally filtered by path, sha (branch/tag), since/until.
      #       Returns sha, author, message, and date for each commit.
      #   - name: get-commit
      #     description: >
      #       Get full details (metadata, author, committer, files changed) for a single commit.
      #       Parameters: owner, repo, commit_sha.
      #   - name: list-branches
      #     description: >
      #       List branches on owner/repo with pagination. Returns branch name and latest commit info.
      #   - name: search-commits
      #     description: >
      #       Search GitHub commits via the official search syntax. Scope with repo:owner/repo, author:,
      #       committer-date:, hash:. Returns sha, repo, author, message.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  # ── Agents ───────────────────────────────────────────────────────────────────
  #
  # senior-programmer: a senior software engineer persona for the agent-orca project.
  # It consults the handbook KB first, then falls back to live GitHub MCP tools,
  # back-filling read content into the KB with _rag_ingest.
  agents:
    - name: senior-programmer
      modelSelectorRef: "openrouter-switchyard"
      disableClarify: true # fully autonomous — never blocks on a human
      systemPrompt: |
        You are a senior software engineer for the agent-orca project. You are precise,
        methodical, and thrifty with model spend. You know the codebase's architecture,
        its Go controllers, the model-router sidecar contract, the KnowledgeBase/Qdrant
        pipeline, and how MCP stdio sidecars are mounted into agent pods.

        Your toolkit beyond the standard tools:
          _webhook_notify        — post a message to the team Slack channel via an incoming
                                   webhook (no per-user auth; shared channel, no data residency).
          fs_list_dir            — list a directory of the user's LOCAL workspace via the ACP
                                   editor bridge ("." is the workspace root). Use this to
                                   explore the workspace before reading files.
          fs_read_text_file      — read a file from that same local workspace; paths must
                                   stay inside the workspace the editor opened.
          fs_write_text_file     — create/overwrite a file in that same local workspace.
                                   Each write asks the user for approval in the editor by
                                   policy. Prefer fs_* edits for iterating in the user's
                                   checkout; use the GitHub MCP tools when the change must
                                   land as a commit/PR on a branch instead.

        WORKFLOW for every request:
          1. ANSWER precisely. Cite file paths (e.g. internal/controller/knowledgebase_controller.go),
             include short relevant snippets (≤5 lines), explain the how and why, and
             note caveats (e.g. "the dev profile disables leader election"; "webhooks are
             Ignore in dev"). If the question is out of scope for this repo, politely say
             so and ask for the target repo (owner/repo).

        CODE REVIEW mode: when asked to review a diff, search the relevant package, read
        the surrounding code, then comment on correctness, idiomatic Go, RBAC alignment,
        webhook gating, and NetworkPolicy implications. Never praise junk; be blunt and fair.

        DEBUGGING mode: when asked why something is broken, search the handbook debugging
        section, inspect recent commits (list_commits / get_commit), then read the suspect
        controller/tool. Form a hypothesis, point at the most likely root cause, and give a
        reproducible kubectl incantation to confirm.

        SLACK NOTIFY: after completing a task (or at the end of a turn), use _webhook_notify
        to post a brief, factual summary to the team channel — e.g. the result, a PR link,
        or a status update. Never dump secrets or full transcripts; keep it terse.

        Output style: technical, terse but complete. Use short markdown sections with
        file-path citations. Do not fluff.
      # In discovery mode (spec.discoverability defaults to "enabled" with no
      # spec.tools), reference the MCPServer by name. The controller creates a
      # connector Tool CR named "github-mcp" / "slack-mcp"; at runtime the
      # model-router discovers all of each server's tools (restricted here to
      # read-only via --tools) and exposes their real underscore names
      # (get_file_contents, etc.) to the LLM.
      tools:
        - github-mcp
      # ACP fs/* relay (issue #34): relay local-workspace reads/writes through the
      # `aoctl acp serve` bridge to the editor (Zed). Without 'aoctl acp serve' there
      # is no bridge to answer fs calls — fs tool calls then fail with a structured
      # error telling the agent to ask the user to reconnect.
      filesystem:
        mode: readWrite      # readOnly would expose only fs_read_text_file
        writeApproval: true  # the bridge elicits user approval for every write
      knowledgeBases: []
      # sandbox_exec (docs/sandbox-shell.md): runs get a per-run OpenShell sandbox for shell
      # commands. The coder SandboxClass alone decides what it can reach. AgentDeployments
      # (the chat pods) do not get the tool.
      shell:
        classRef: coder
        image: "ghcr.io/heddles/agent-orca/dev-sandbox:v0.10.1"
        workDir: /sandbox
        maxTimeoutSeconds: 600
      runtime:
        ociRef: "ghcr.io/heddles/agent-orca/openai-reference:latest"
        framework: openai-compatible
        # http mode keeps warm-pool pods alive and reusable for low-latency chat.
        inputMode: http
      memory:
        checkpointEvery: 5
        resumeWindowSeconds: 3600
        # Hindsight memory is opt-in per Agent; this one keeps a bank across
        # chats (agent-orca-system--senior-programmer).
        hindsight:
          enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 2Gi
  # ── AgentDeployments ─────────────────────────────────────────────────────────
  #
  # senior-programmer-chat: chat-mode deployment backing the request:
  #   POST /api/deployments/agent-orca-system/senior-programmer-chat/execute
  agentDeployments:
    - name: senior-programmer-chat
      agentRef: senior-programmer
      inputSource:
        type: chat
      replicas: 1
      warmPoolSize: 1
      # Allow large MCP/file/commit-patch reads (e.g. router.go is ~153K chars) through
      # untruncated. When omitted the operator derives a context-window-aware default
      # (~10% of the model's ContextWindow, floored at 8k / capped at 64k tokens).
      maxToolResultTokens: 64000
      # Conservative loop guards so a stuck agent halts with a clear message instead of
      # spinning silently. Thresholds are deliberately generous so legitimate repeated
      # tool use (e.g. reading many distinct files during a PR review) is NOT blocked —
      # MaxRepeatedToolCalls keys on identical tool+args, so distinct files don't count.
      safeguards:
        maxConsecutiveNoopTurns: 15
        maxRepeatedToolCalls: 50
        # toolFrequencyCap intentionally omitted (opt-in): a big PR review can legitimately
        # call one tool hundreds of times. Leave 0 to keep it disabled.
      restartPolicy:
        minBackoffSeconds: 5
        maxBackoffSeconds: 300
        maxConsecutiveFailures: 10
      # Incoming-webhook Slack notification: warm pods mount the webhook-notify Secret's
      # `url` key as WEBHOOK_URL into the model-router sidecar, exposing _webhook_notify.
      webhookNotify:
        webhookSecretRef:
          name: webhook-notify
          key: url
