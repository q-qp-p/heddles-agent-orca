---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-agentorca-agentorca-io-v1alpha1-agent
  failurePolicy: Fail
  name: vagent.kb.io
  rules:
  - apiGroups:
    - agentorca.agentorca.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agents
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-agentorca-agentorca-io-v1alpha1-agentrun
  failurePolicy: Fail
  name: vagentrun.kb.io
  rules:
  - apiGroups:
    - agentorca.agentorca.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agentruns
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-agentorca-agentorca-io-v1alpha1-sandboxclass
  failurePolicy: Fail
  name: vsandboxclass.kb.io
  rules:
  - apiGroups:
    - agentorca.agentorca.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - sandboxclasses
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-agentorca-agentorca-io-v1alpha1-tool
  failurePolicy: Fail
  name: vtool.kb.io
  rules:
  - apiGroups:
    - agentorca.agentorca.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tools
  sideEffects: None
