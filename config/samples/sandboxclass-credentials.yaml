# A general-purpose SandboxClass with a credential that is not GitHub: an API token the
# sandbox's commands can use but never read. Nothing here is specific to coding. Any binary
# in the sandbox image (curl, psql, terraform, an SDK) can use the credential.
#
#   kubectl apply -f config/samples/sandboxclass-credentials.yaml
#
# How it works:
#  * The Secret below holds the real token. Only the operator reads it.
#  * Each sandbox of the class gets the placeholder in $AGENTORCA_CRED_WAREHOUSE. The
#    supervisor swaps in the real token on requests to api.example.com:443 made by
#    /usr/bin/curl, and nowhere else.
#  * A command sends the placeholder like the real thing:
#      curl -H "Authorization: Bearer $AGENTORCA_CRED_WAREHOUSE" https://api.example.com/v1/jobs
#  * A credential binds an endpoint, it does not open one: the egress rule below is what lets
#    the sandbox reach the host, and its access (read-write) is what the credential can do.
#    Without it, requests to the host would be limited to GET, HEAD and OPTIONS.
#
# secretRef reads the Secret from the namespace of the workload that uses the class, so each
# tenant's agents get their own token under the same name. To read another namespace, set
# secretRef.namespace to one of the allowedNamespaces of the tenant the workload belongs to.
apiVersion: agentorca.agentorca.io/v1alpha1
kind: SandboxClass
metadata:
  name: general
spec:
  namespaceSelector:
    matchLabels: {agentorca.io/enable-sandboxes: "true"}
  enforcement: enforce
  egress:
    - {host: api.example.com, access: read-write}
  egressPresets: [pypi]
  credentials:
    - name: warehouse
      source:
        secretRef: {name: warehouse-token, key: token}
      bind:
        host: api.example.com
        binaries: [/usr/bin/curl]
        paths: ["/v1/**"]          # optional: the token works for these URL paths only
      inject: {style: bearer}      # bearer (default), basic, or header (with name)
  resources:
    requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 10Gi}
    limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 10Gi}
---
# The token itself, in the namespace of the agents that use the class. Replace the value.
apiVersion: v1
kind: Secret
metadata:
  name: warehouse-token
  namespace: agent-orca-system
type: Opaque
stringData:
  token: REPLACE_ME
