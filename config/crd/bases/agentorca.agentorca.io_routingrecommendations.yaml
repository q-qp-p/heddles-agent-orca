---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: routingrecommendations.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: RoutingRecommendation
    listKind: RoutingRecommendationList
    plural: routingrecommendations
    singular: routingrecommendation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.selectorRef
      name: Selector
      type: string
    - jsonPath: .spec.detector
      name: Detector
      type: string
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RoutingRecommendation is a change to a ModelSelector that benchmark and
          passive evidence support, with the patch that makes it and the one that undoes
          it. The operator proposes; a person decides.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RoutingRecommendationSpec is a change to a ModelSelector the evidence supports.
              The operator writes everything but action, and it cannot be edited: a finding
              with a different patch is a new recommendation. The rules below compare
              presence as well as value, so a field left out at creation (a report-only
              recommendation has no patch) cannot be added later.
            properties:
              action:
                default: none
                description: |-
                  Action is what a person asks for: none, requestApply or rollback. It is the
                  only field that can change.
                enum:
                - none
                - requestApply
                - rollback
                type: string
              agent:
                description: |-
                  Agent is the Agent whose work the finding is about. Empty for a finding
                  about the selector as a whole.
                type: string
              baseGeneration:
                description: BaseGeneration is the ModelSelector generation the finding
                  was made against.
                format: int64
                type: integer
              benchmarkRef:
                description: |-
                  BenchmarkRef names the RoutingBenchmark whose samples back the finding.
                  Empty when it rests on passive data alone, such as a dead provider.
                type: string
              category:
                description: Category is the task category it is about, such as "stage:tool-exec".
                type: string
              caveat:
                description: Caveat is something to weigh even though there is a patch.
                type: string
              detector:
                description: Detector is the check that found it.
                enum:
                - overspend
                - underpowered
                - threshold
                - deadProvider
                - strategySwitch
                type: string
              patch:
                description: |-
                  Patch is an RFC 7386 merge patch against the ModelSelector, as JSON. Empty
                  when the finding is report-only; reason says why.
                type: string
              reason:
                description: Reason says why there is no patch.
                type: string
              rollbackPatch:
                description: |-
                  RollbackPatch undoes patch from the selector as it was when the finding was
                  made. It is re-derived when the patch is applied.
                type: string
              selectorRef:
                description: SelectorRef names the ModelSelector, in this namespace,
                  the change is for.
                minLength: 1
                type: string
              summary:
                description: Summary says what the evidence shows, in a sentence.
                type: string
            required:
            - baseGeneration
            - detector
            - selectorRef
            - summary
            type: object
            x-kubernetes-validations:
            - message: selectorRef is immutable
              rule: self.selectorRef == oldSelf.selectorRef
            - message: detector is immutable
              rule: self.detector == oldSelf.detector
            - message: summary is immutable
              rule: self.summary == oldSelf.summary
            - message: baseGeneration is immutable
              rule: self.baseGeneration == oldSelf.baseGeneration
            - message: benchmarkRef is immutable
              rule: has(self.benchmarkRef) == has(oldSelf.benchmarkRef) && (!has(self.benchmarkRef)
                || self.benchmarkRef == oldSelf.benchmarkRef)
            - message: agent is immutable
              rule: has(self.agent) == has(oldSelf.agent) && (!has(self.agent) ||
                self.agent == oldSelf.agent)
            - message: category is immutable
              rule: has(self.category) == has(oldSelf.category) && (!has(self.category)
                || self.category == oldSelf.category)
            - message: patch is immutable
              rule: has(self.patch) == has(oldSelf.patch) && (!has(self.patch) ||
                self.patch == oldSelf.patch)
            - message: rollbackPatch is immutable
              rule: has(self.rollbackPatch) == has(oldSelf.rollbackPatch) && (!has(self.rollbackPatch)
                || self.rollbackPatch == oldSelf.rollbackPatch)
            - message: reason is immutable
              rule: has(self.reason) == has(oldSelf.reason) && (!has(self.reason)
                || self.reason == oldSelf.reason)
            - message: caveat is immutable
              rule: has(self.caveat) == has(oldSelf.caveat) && (!has(self.caveat)
                || self.caveat == oldSelf.caveat)
          status:
            description: RoutingRecommendationStatus is the observed state of a recommendation.
            properties:
              appliedAt:
                description: |-
                  AppliedAt and AppliedGeneration say when and as which ModelSelector
                  generation the patch took effect.
                format: date-time
                type: string
              appliedGeneration:
                format: int64
                type: integer
              appliedRollbackPatch:
                description: |-
                  AppliedRollbackPatch undoes the change from the selector as it was just
                  before it was applied.
                type: string
              approvalID:
                description: ApprovalID identifies the approval request raised for
                  the change.
                type: string
              conditions:
                description: Conditions holds standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              corroboration:
                description: Corroboration lists independent signals that agree with
                  the finding.
                items:
                  type: string
                type: array
              evidence:
                description: |-
                  Evidence is the numbers behind the finding, refreshed on every evaluation:
                  sample counts, net win with its interval, cost per win, projected savings.
                x-kubernetes-preserve-unknown-fields: true
              lastEvaluated:
                description: LastEvaluated is when the evidence was last refreshed.
                format: date-time
                type: string
              message:
                description: Message says why the phase is what it is.
                type: string
              phase:
                description: Phase is where the recommendation is in its life.
                enum:
                - Proposed
                - PendingApproval
                - Applied
                - Rejected
                - Stale
                - Superseded
                - RolledBack
                - Expired
                type: string
              postApply:
                description: PostApply is the check made one window after the change.
                properties:
                  evaluatedAt:
                    description: EvaluatedAt is when the check ran.
                    format: date-time
                    type: string
                  message:
                    description: Message says what the check found.
                    type: string
                  verdict:
                    description: Verdict is Confirmed, Regressed, Inconclusive or
                      NotAssessed.
                    type: string
                required:
                - verdict
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
